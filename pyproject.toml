[project]
name = "classifier-fastapi"
version = "0.1.0"
description = "FastAPI microservice for ATAP LLM text classification"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Sebastian Haan" }
]
dependencies = [
    "pyyaml>=6.0.1",
    "openai>=1.59.7",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.2.1",
    "litellm>=1.80.0",
    "loguru>=0.7.2",
    "pandas>=2.0.0",
    "tiktoken>=0.8.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.35.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "aiofiles>=24.1.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.27.0",
]
dev = [
    "ruff>=0.4.3",
    "pytest>=8.2.0",
]
streamlit = [
    "streamlit>=1.28.0",
]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: integration tests requiring real API keys",
    "slow: slow running tests"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["classifier_fastapi", "atap_llm_classifier"]
